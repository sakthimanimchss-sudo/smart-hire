<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmartHire | Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
 href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
/* ================= RESET ================= */
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;
  height:100%;
  font-family:Segoe UI,Arial,sans-serif;
  background:linear-gradient(135deg,#0f1c24,#1b2a3a);
}

/* ================= THEME ================= */
:root{
  --blue:#1e3a8a;
  --yellow:#ff9900;
  --card:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
}

/* ================= CENTER WRAP ================= */
.login-wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

/* ================= CARD ================= */
.login-card{
  width:100%;
  max-width:460px;
  background:var(--card);
  border-radius:22px;
  padding:42px;
  box-shadow:0 40px 90px rgba(0,0,0,.35);
  animation:fadeUp .7s ease forwards;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(40px)}
  to{opacity:1;transform:translateY(0)}
}

/* ================= HEADER ================= */
.back-home{
  font-size:14px;
  color:var(--blue);
  font-weight:600;
  margin-bottom:18px;
  display:inline-block;
}

.logo{
  width:52px;height:52px;
  border-radius:14px;
  background:var(--blue);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:22px;
  margin-bottom:18px;
}

h2{
  font-size:28px;
  color:var(--text);
  margin-bottom:6px;
}

.subtitle{
  font-size:14px;
  color:var(--muted);
  margin-bottom:26px;
}

/* ================= FORM ================= */
.field{
  position:relative;
  margin-bottom:14px;
}
.field input{
  width:100%;
  padding:14px 46px 14px 14px;
  border-radius:12px;
  border:1.5px solid #d1d5db;
  background:#f9fafb;
  font-size:15px;
  outline:none;
}
.field i{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  color:#94a3b8;
  cursor:pointer;
}

.field input:focus{
  background:#fff;
  border-color:var(--yellow);
  box-shadow:0 0 0 3px rgba(255,153,0,.25);
}

/* ================= OPTIONS ================= */
.options{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:13px;
  margin:12px 0 22px;
}
.options a{
  color:var(--blue);
  font-weight:600;
}

/* ================= LOGIN BUTTON ================= */
.login-btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:999px;
  background:var(--yellow);
  color:#fff;
  font-weight:800;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 18px 40px rgba(255,153,0,.4);
  transition:.3s;
}
.login-btn:hover{
  transform:translateY(-3px);
}

/* ================= SOCIAL ================= */
.divider{
  text-align:center;
  font-size:13px;
  color:#94a3b8;
  margin:22px 0;
}

.social{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.social button{
  padding:12px;
  border-radius:12px;
  border:1px solid #e5e7eb;
  background:#fff;
  font-weight:700;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:.3s;
}
.social button:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 25px rgba(0,0,0,.15);
}

/* ================= FOOTER ================= */
.footer{
  text-align:center;
  margin-top:20px;
  font-size:13px;
}
.footer a{
  color:var(--blue);
  font-weight:700;
}
/* ================= MOBILE ================= */
@media(max-width:480px){
  .login-card{
    padding:30px;
    border-radius:18px;
  }
}
</style>
</head>

<body>

<div class="login-wrap">

  <div class="login-card">

    <a href="index.html" class="back-home">← Back to Home</a>

    <div class="logo">S</div>

    <h2 id="typingText"></h2>
    <div class="subtitle">Login to continue with SmartHire</div>

    <div class="field">
      <input type="email" id="email" placeholder="Email address">
      <i class="fa-regular fa-envelope"></i>
    </div>

    <div class="field">
      <input type="password" id="password" placeholder="Password">
      <i class="fa-regular fa-eye" onclick="togglePassword(this)"></i>
    </div>

    <div class="options">
      <label>
        <input type="checkbox" id="remember"> Remember me
      </label>
      <a href="#">Forgot password?</a>
    </div>

    <button class="login-btn">Login</button>

    <div class="divider">or continue with</div>

    <div class="social">
      <button><i class="fa-brands fa-google"></i> Google</button>
      <button><i class="fa-brands fa-linkedin"></i> LinkedIn</button>
      <button><i class="fa-brands fa-github"></i> GitHub</button>
      <button><i class="fa-brands fa-microsoft"></i> Microsoft</button>
    </div>

    <div class="footer">
      Don’t have an account? <a href="register.html">Create Account</a>
    </div>

  </div>

</div>

<script>
/* ================= AUTO TYPING ================= */
const text = "SmartHire Login";
let i = 0;
const target = document.getElementById("typingText");

function type(){
  if(i < text.length){
    target.textContent += text.charAt(i++);
    setTimeout(type, 90);
  }
}
type();

/* ================= PASSWORD TOGGLE ================= */
function togglePassword(icon){
  const input = document.getElementById("password");
  if(input.type === "password"){
    input.type = "text";
    icon.classList.replace("fa-eye","fa-eye-slash");
  }else{
    input.type = "password";
    icon.classList.replace("fa-eye-slash","fa-eye");
  }
}

/* ================= REMEMBER ME ================= */
const emailInput = document.getElementById("email");
const remember = document.getElementById("remember");

if(localStorage.getItem("rememberEmail")){
  emailInput.value = localStorage.getItem("rememberEmail");
  remember.checked = true;
}

remember.addEventListener("change",()=>{
  if(remember.checked){
    localStorage.setItem("rememberEmail", emailInput.value);
  }else{
    localStorage.removeItem("rememberEmail");
  }
});
</script>

</body>
</html>
