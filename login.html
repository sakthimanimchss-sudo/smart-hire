<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- ✅ FAVICON (WORKING ON ALL PAGES) -->
<link rel="icon" type="image/png"
 href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

<title>SmartHire | Login</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ================= ICONS ================= -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
/* =====================================================
   SMARTHIRE LOGIN — FULL CSS
===================================================== */

/* ================= ROOT ================= */
:root{
  --primary:#2b3990;
  --primary-dark:#1e2a78;
  --light:#f5f7fb;
  --white:#ffffff;
  --text:#111;
  --muted:#6b7280;
  --border:#e5e7eb;
  --radius:16px;
  --shadow:0 30px 60px rgba(0,0,0,.15);
}

/* ================= RESET ================= */
*,
*::before,
*::after{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
}

body{
  font-family:Inter,Segoe UI,Arial,sans-serif;
  background:linear-gradient(135deg,#eef2ff,#f8fafc);
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow-x:hidden;
}

a{
  text-decoration:none;
  color:inherit;
}

/* ================= HEADER ================= */
.header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  background:#fff;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
  z-index:1000;
}

.nav{
  max-width:1400px;
  margin:auto;
  padding:14px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo span{
  width:42px;
  height:42px;
  background:var(--primary);
  color:#fff;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:18px;
}

.logo h1{
  font-size:22px;
  color:var(--primary);
}

/* ================= LOGIN WRAPPER ================= */
.login-wrapper{
  width:100%;
  padding:120px 16px 40px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= CARD ================= */
.login-card{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:20px;
  box-shadow:var(--shadow);
  padding:36px;
  animation:fadeUp .8s ease;
}

/* ================= ANIMATION ================= */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(40px)}
  to{opacity:1;transform:none}
}

/* ================= TITLE ================= */
.login-card h2{
  font-size:28px;
  color:var(--primary);
  margin-bottom:8px;
}

.login-card p{
  font-size:14px;
  color:var(--muted);
  margin-bottom:26px;
}

/* ================= FORM ================= */
.form-group{
  margin-bottom:18px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:6px;
}

.input-wrap{
  position:relative;
}

.input-wrap input{
  width:100%;
  padding:14px 44px 14px 14px;
  border:1px solid var(--border);
  border-radius:10px;
  font-size:15px;
  outline:none;
}

.input-wrap input:focus{
  border-color:var(--primary);
}

.input-wrap i{
  position:absolute;
  top:50%;
  right:14px;
  transform:translateY(-50%);
  color:#9ca3af;
  cursor:pointer;
}

/* ================= OPTIONS ================= */
.options{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:16px 0 24px;
  font-size:14px;
}

.options label{
  display:flex;
  align-items:center;
  gap:6px;
  cursor:pointer;
}

.options a{
  color:var(--primary);
  font-weight:600;
}

/* ================= BUTTON ================= */
.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:30px;
  background:var(--primary);
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  transition:.3s;
}

.btn:hover{
  background:var(--primary-dark);
}

/* ================= DIVIDER ================= */
.divider{
  display:flex;
  align-items:center;
  gap:12px;
  margin:26px 0;
  color:#9ca3af;
  font-size:13px;
}

.divider::before,
.divider::after{
  content:"";
  flex:1;
  height:1px;
  background:#e5e7eb;
}

/* ================= SOCIAL LOGIN ================= */
.social-login{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.social-btn{
  padding:12px;
  border:1px solid var(--border);
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  cursor:pointer;
  transition:.3s;
  background:#fff;
}

.social-btn:hover{
  background:#f3f4f6;
}

/* ================= FOOT ================= */
.footer-text{
  margin-top:22px;
  text-align:center;
  font-size:14px;
}

.footer-text a{
  color:var(--primary);
  font-weight:700;
}

/* ================= RESPONSIVE ================= */
@media(max-width:480px){
  .login-card{
    padding:28px 22px;
  }
  .login-card h2{
    font-size:24px;
  }
}

/* ================= ACCESSIBILITY ================= */
button:active{
  transform:scale(.97);
}

*{-webkit-tap-highlight-color:transparent}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->
<header class="header">
  <div class="nav">
    <a href="index.html" class="logo">
      <span>S</span>
      <h1>SmartHire</h1>
    </a>
  </div>
</header>

<!-- ================= LOGIN ================= -->
<div class="login-wrapper">

  <div class="login-card">

    <h2>Welcome Back</h2>
    <p>Please enter your login details to continue</p>

    <form>

      <!-- EMAIL -->
      <div class="form-group">
        <label>Email Address</label>
        <div class="input-wrap">
          <input type="email" placeholder="you@company.com" required>
          <i class="fa-solid fa-envelope"></i>
        </div>
      </div>

      <!-- PASSWORD -->
      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="Enter password" required>
          <i class="fa-solid fa-eye" id="togglePassword"></i>
        </div>
      </div>

      <!-- OPTIONS -->
      <div class="options">
        <label>
          <input type="checkbox">
          Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>

      <!-- SUBMIT -->
      <button class="btn" type="submit">Sign In</button>

    </form>

    <!-- DIVIDER -->
    <div class="divider">OR</div>

    <!-- SOCIAL LOGIN -->
    <div class="social-login">
      <div class="social-btn"><i class="fab fa-google"></i></div>
      <div class="social-btn"><i class="fab fa-facebook-f"></i></div>
      <div class="social-btn"><i class="fab fa-apple"></i></div>
    </div>

    <!-- FOOTER -->
    <div class="footer-text">
      Don’t have an account?
      <a href="register.html">Sign up</a>
    </div>

  </div>
</div>

<!-- ================= JS ================= -->
<script>
/* PASSWORD TOGGLE */
const toggle = document.getElementById("togglePassword");
const password = document.getElementById("password");

toggle.addEventListener("click", ()=>{
  const type = password.getAttribute("type") === "password" ? "text" : "password";
  password.setAttribute("type", type);
  toggle.classList.toggle("fa-eye");
  toggle.classList.toggle("fa-eye-slash");
});
</script>

</body>
</html>
