<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmartHire | Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- FONT & ICONS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
/* ================= ROOT ================= */
:root{
  --primary:#2b3990;
  --primary-dark:#1f2c70;
  --bg:#f5f7fb;
  --white:#ffffff;
  --text:#111;
  --muted:#6b7280;
  --border:#dcdfe6;
  --radius:14px;
  --shadow:0 25px 60px rgba(0,0,0,.12);
}

/* ================= RESET ================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
body{
  font-family:Inter,Segoe UI,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= LOGIN WRAPPER ================= */
.login-wrapper{
  width:100%;
  padding:20px;
}

/* ================= LOGIN CARD ================= */
.login-card{
  max-width:420px;
  margin:auto;
  background:var(--white);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:36px 32px;
  position:relative;
  overflow:hidden;
}

/* decorative curve */
.login-card::after{
  content:"";
  position:absolute;
  top:-80px;
  right:-80px;
  width:220px;
  height:220px;
  background:linear-gradient(135deg,var(--primary),#5f6bdb);
  border-radius:50%;
  opacity:.95;
}

/* ================= BRAND ================= */
.login-brand{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:24px;
}

.login-brand span{
  width:44px;
  height:44px;
  background:var(--primary);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  font-weight:800;
  font-size:18px;
}

.login-brand h1{
  font-size:22px;
  color:var(--primary);
}

/* ================= TITLE ================= */
.login-card h2{
  font-size:26px;
  margin-bottom:6px;
}
.login-card p{
  font-size:14px;
  color:var(--muted);
  margin-bottom:22px;
}

/* ================= FORM ================= */
.form-group{
  margin-bottom:16px;
}
.form-group label{
  display:block;
  font-size:13px;
  margin-bottom:6px;
  color:#333;
}
.form-group input{
  width:100%;
  padding:12px 14px;
  border:1px solid var(--border);
  border-radius:10px;
  font-size:14px;
  outline:none;
}
.form-group input:focus{
  border-color:var(--primary);
}

/* password eye */
.password-wrap{
  position:relative;
}
.password-wrap i{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  color:#888;
  cursor:pointer;
}

/* ================= OPTIONS ================= */
.login-options{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:10px 0 20px;
  font-size:13px;
}
.login-options a{
  color:var(--primary);
  text-decoration:none;
}
.login-options a:hover{
  text-decoration:underline;
}

/* ================= BUTTON ================= */
.btn-login{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:var(--primary);
  color:#fff;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:.3s;
}
.btn-login:hover{
  background:var(--primary-dark);
}

/* ================= DIVIDER ================= */
.divider{
  display:flex;
  align-items:center;
  gap:10px;
  margin:22px 0;
  font-size:13px;
  color:var(--muted);
}
.divider::before,
.divider::after{
  content:"";
  flex:1;
  height:1px;
  background:#e5e7eb;
}

/* ================= SOCIAL LOGIN ================= */
.social-login{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}
.social-login button{
  border:1px solid var(--border);
  background:#fff;
  border-radius:10px;
  padding:10px;
  font-size:18px;
  cursor:pointer;
  transition:.3s;
}
.social-login button:hover{
  background:#f0f3ff;
}

/* ================= FOOTER ================= */
.login-footer{
  margin-top:20px;
  text-align:center;
  font-size:14px;
}
.login-footer a{
  color:var(--primary);
  font-weight:600;
  text-decoration:none;
}

/* ================= RESPONSIVE ================= */
@media(max-width:480px){
  .login-card{
    padding:28px 22px;
  }
}
</style>
</head>

<body>

<div class="login-wrapper">
  <div class="login-card">

    <!-- BRAND -->
    <a href="index.html" class="login-brand" style="text-decoration:none">
      <span>S</span>
      <h1>SmartHire</h1>
    </a>

    <!-- TITLE -->
    <h2>Welcome Back</h2>
    <p>Please enter your login details</p>

    <!-- FORM -->
    <form>
      <div class="form-group">
        <label>Email address</label>
        <input type="email" placeholder="you@company.com" required>
      </div>

      <div class="form-group password-wrap">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
        <i class="fa-regular fa-eye" onclick="togglePassword()"></i>
      </div>

      <div class="login-options">
        <label>
          <input type="checkbox" checked> Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit" class="btn-login">Sign In</button>
    </form>

    <!-- DIVIDER -->
    <div class="divider">or</div>

    <!-- SOCIAL -->
    <div class="social-login">
      <button title="Google"><i class="fab fa-google"></i></button>
      <button title="Facebook"><i class="fab fa-facebook-f"></i></button>
      <button title="Apple"><i class="fab fa-apple"></i></button>
    </div>

    <!-- FOOTER -->
    <div class="login-footer">
      Don’t have an account?
      <a href="register.html">Sign up</a>
    </div>

  </div>
</div>

<script>
function togglePassword(){
  const input = document.getElementById("password");
  input.type = input.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
