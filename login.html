<!DOCTYPE html>
<html lang="en">
<head>

<!-- =========================================================
  BASIC META
========================================================= -->
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartHire | Login</title>

<!-- FAVICON (ADD ON ALL PAGES) -->
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="shortcut icon" href="assets/favicon.png">

<!-- =========================================================
  GOOGLE FONT
========================================================= -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- =========================================================
  ICONS
========================================================= -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- =========================================================
  GLOBAL STYLE
========================================================= -->
<style>

/* =========================================================
   ROOT VARIABLES
========================================================= */
:root{
  --primary:#2b3990;
  --primary-dark:#1f2b70;
  --light:#f4f7fc;
  --text:#1a1a1a;
  --muted:#6b7280;
  --border:#e5e7eb;
  --success:#16a34a;
  --error:#dc2626;
}

/* =========================================================
   RESET
========================================================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
}

body{
  font-family:"Inter",system-ui,Segoe UI,Arial,sans-serif;
  background:linear-gradient(135deg,#eef2ff,#f8fafc);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  color:var(--text);
}

/* =========================================================
   BACKGROUND DECOR
========================================================= */
.bg-shape{
  position:absolute;
  width:420px;
  height:420px;
  background:radial-gradient(circle at top,var(--primary),transparent 70%);
  opacity:.15;
  border-radius:50%;
  filter:blur(40px);
}

.bg-shape.one{top:-120px;left:-120px}
.bg-shape.two{bottom:-140px;right:-140px}

/* =========================================================
   LOGIN CARD
========================================================= */
.login-wrapper{
  position:relative;
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:20px;
  padding:40px 36px;
  box-shadow:0 30px 70px rgba(0,0,0,.15);
  animation:cardIn .8s ease;
}

@keyframes cardIn{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:none}
}

/* =========================================================
   BRAND
========================================================= */
.brand{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin-bottom:28px;
}

.brand span{
  width:46px;
  height:46px;
  background:var(--primary);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:800;
  border-radius:12px;
}

.brand h1{
  font-size:22px;
  color:var(--primary);
  font-weight:800;
}

.brand{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin-bottom:28px;
  text-decoration:none;      /* 🔥 remove underline */
  cursor:pointer;
}

.brand h1{
  color:var(--primary);      /* keep blue */
}

.brand:hover h1{
  text-decoration:underline; /* optional hover effect */
}

/* =========================================================
   TITLES
========================================================= */
.login-wrapper h2{
  font-size:24px;
  font-weight:700;
  text-align:center;
  margin-bottom:6px;
}

.login-wrapper p.subtitle{
  text-align:center;
  font-size:14px;
  color:var(--muted);
  margin-bottom:30px;
}

/* =========================================================
   FORM
========================================================= */
.form-group{
  margin-bottom:18px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:6px;
}

.input-wrap{
  position:relative;
}

.input-wrap input{
  width:100%;
  padding:14px 44px 14px 14px;
  border-radius:10px;
  border:1.6px solid var(--border);
  font-size:14px;
  outline:none;
  transition:.25s;
}

.input-wrap input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(43,57,144,.15);
}

.input-wrap i{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
  cursor:pointer;
}

/* =========================================================
   FORM OPTIONS
========================================================= */
.form-options{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:13px;
  margin:12px 0 22px;
}

.form-options a{
  color:var(--primary);
  font-weight:600;
  text-decoration:none;
}

.form-options a:hover{text-decoration:underline}

/* =========================================================
   BUTTON
========================================================= */
.btn-login{
  width:100%;
  border:none;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;
  padding:14px;
  font-size:15px;
  font-weight:700;
  border-radius:30px;
  cursor:pointer;
  transition:.3s;
}

.btn-login:hover{
  filter:brightness(1.05);
  transform:translateY(-1px);
}

/* =========================================================
   DIVIDER
========================================================= */
.divider{
  display:flex;
  align-items:center;
  gap:12px;
  margin:26px 0;
  font-size:13px;
  color:var(--muted);
}

.divider::before,
.divider::after{
  content:"";
  flex:1;
  height:1px;
  background:var(--border);
}

/* =========================================================
   SOCIAL LOGIN
========================================================= */
.socials{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.socials button{
  border:1.6px solid var(--border);
  background:#fff;
  padding:10px 0;
  border-radius:10px;
  font-size:18px;
  cursor:pointer;
  transition:.25s;
}

.socials button:hover{
  border-color:var(--primary);
  transform:translateY(-2px);
}

/* =========================================================
   FOOTER
========================================================= */
.form-footer{
  text-align:center;
  margin-top:26px;
  font-size:14px;
}

.form-footer a{
  color:var(--primary);
  font-weight:700;
  text-decoration:none;
}

.form-footer a:hover{text-decoration:underline}

/* =========================================================
   ERROR & SUCCESS
========================================================= */
.msg{
  display:none;
  padding:10px 14px;
  border-radius:8px;
  font-size:13px;
  margin-bottom:16px;
}

.msg.error{
  background:#fee2e2;
  color:var(--error);
}

.msg.success{
  background:#dcfce7;
  color:var(--success);
}

/* =========================================================
   LOADER
========================================================= */
.loader{
  display:none;
  justify-content:center;
  margin-top:14px;
}

.loader span{
  width:8px;
  height:8px;
  background:var(--primary);
  border-radius:50%;
  margin:0 4px;
  animation:bounce 1.4s infinite ease-in-out both;
}

.loader span:nth-child(2){animation-delay:.2s}
.loader span:nth-child(3){animation-delay:.4s}

@keyframes bounce{
  0%,80%,100%{transform:scale(0)}
  40%{transform:scale(1)}
}

/* =========================================================
   RESPONSIVE
========================================================= */
@media(max-width:480px){
  .login-wrapper{padding:30px 22px}
}

</style>
</head>

<body>

<!-- BACKGROUND SHAPES -->
<div class="bg-shape one"></div>
<div class="bg-shape two"></div>

<!-- =========================================================
  LOGIN CARD
========================================================= -->
<div class="login-wrapper">

  <!-- BRAND -->
<a href="index.html" class="brand">
  <span>S</span>
  <h1>SmartHire</h1>
</a>


  <h2>Welcome Back</h2>
  <p class="subtitle">Login to access your dashboard</p>

  <!-- MESSAGE -->
  <div class="msg error" id="errorMsg">Invalid email or password</div>
  <div class="msg success" id="successMsg">Login successful</div>

  <!-- FORM -->
  <form id="loginForm">

    <div class="form-group">
      <label>Email Address</label>
      <div class="input-wrap">
        <input type="email" id="email" placeholder="you@company.com" required>
        <i class="fa-regular fa-envelope"></i>
      </div>
    </div>

    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <input type="password" id="password" placeholder="••••••••" required>
        <i class="fa-regular fa-eye" id="togglePass"></i>
      </div>
    </div>

    <div class="form-options">
      <label>
        <input type="checkbox"> Remember me
      </label>
      <a href="#">Forgot password?</a>
    </div>

    <button class="btn-login" type="submit">Sign In</button>

    <div class="loader" id="loader">
      <span></span><span></span><span></span>
    </div>

    <div class="divider">OR</div>

    <div class="socials">
      <button><i class="fab fa-google"></i></button>
      <button><i class="fab fa-facebook-f"></i></button>
      <button><i class="fab fa-apple"></i></button>
    </div>

    <div class="form-footer">
      Don’t have an account? <a href="register.html">Sign up</a>
    </div>

  </form>
</div>

<!-- =========================================================
  SCRIPT
========================================================= -->
<script>

/* =========================================================
   PASSWORD TOGGLE
========================================================= */
const toggle = document.getElementById("togglePass");
const pass = document.getElementById("password");

toggle.onclick = () => {
  if(pass.type === "password"){
    pass.type = "text";
    toggle.classList.replace("fa-eye","fa-eye-slash");
  }else{
    pass.type = "password";
    toggle.classList.replace("fa-eye-slash","fa-eye");
  }
};

/* =========================================================
   LOGIN SIMULATION
========================================================= */
const form = document.getElementById("loginForm");
const loader = document.getElementById("loader");
const err = document.getElementById("errorMsg");
const ok = document.getElementById("successMsg");

form.addEventListener("submit", e=>{
  e.preventDefault();
  err.style.display="none";
  ok.style.display="none";
  loader.style.display="flex";

  setTimeout(()=>{
    loader.style.display="none";
    ok.style.display="block";

    setTimeout(()=>{
      window.location.href="index.html";
    },1200);
  },1600);
});

</script>

</body>
</html>
